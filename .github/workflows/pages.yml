name: Publish Otlob Wafar after launch checks
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Require connected backend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: test -n "$VITE_API_URL"
      - run: npm run build:web
        env:
          WEB_BASE_PATH: /otlob-wafar/
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          STORE_PUBLIC_URL: ${{ vars.STORE_PUBLIC_URL }}
          SEO_CATALOG_URL: ${{ vars.SEO_CATALOG_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
